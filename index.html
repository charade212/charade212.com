<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B46BKPW1CZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-B46BKPW1CZ');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>charade212</title>

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: black;
      overflow-y: auto;
    }

    #shop {
      max-width: 1200px;
      margin: 40px auto 20px auto;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .product {
      text-align: center;
      flex: 1 1 320px;
      max-width: 360px;
      width: 100%;
    }

    /* Container configured for 1920x1080 (16:9 ratio) */
    .image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 4px;
      background-color: #f5f5f5;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }

    /* Front/Back Hover Effect for Mickey & Minnie */
    .image-container .back-img {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    .image-container:hover .front-img-swap {
      opacity: 0;
    }

    .image-container:hover .back-img {
      opacity: 1;
    }

    .image-container:hover img {
      transform: scale(1.03);
    }

    .product h2 {
      font-size: 18px;
      letter-spacing: 1px;
      margin: 15px 0 10px;
    }

    button {
      background: black;
      color: white;
      border: none;
      padding: 14px 30px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
      width: 100%;
      border-radius: 2px;
    }

    button:hover {
      background: #333;
    }

    a {
      text-decoration: none;
    }

    /* --- RETRO MYSPACE METALLIC PLAYER SKIN --- */
    .player-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 20px 0 40px 0;
    }

    .sidebar-player {
      width: 380px;
      background: linear-gradient(to bottom, #f2f2f2 0%, #cccccc 50%, #aaaaaa 100%);
      border: 2px solid #555555;
      border-right-color: #ffffff;
      border-bottom-color: #ffffff;
      padding: 6px 12px;
      border-radius: 30px;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
    }

    /* Beveled Play/Pause Frame Button */
    .retro-play-container {
      width: 40px;
      height: 40px;
      background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 40%, #b5b5b5 100%);
      border: 2px solid #ffffff;
      border-right-color: #777777;
      border-bottom-color: #777777;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: inset 1px 1px 1px #fff;
      flex-shrink: 0;
    }

    .retro-play-container:active {
      border: 2px solid #777777;
      border-right-color: #ffffff;
      border-bottom-color: #ffffff;
    }

    /* Vertical Twin Pause Bar Component */
    .pause-icon {
      display: flex;
      gap: 4px;
    }

    .pause-bar {
      width: 4px;
      height: 14px;
      background: #555555;
      border-radius: 1px;
    }

    /* Styled Play Triangle Toggle */
    .play-icon {
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 11px solid #555555;
      margin-left: 2px;
      display: none;
    }

    /* Black Digital Track Display Matrix */
    .retro-display {
      flex-grow: 1;
      height: 40px;
      background: #111111;
      border: 2px solid #777777;
      border-right-color: #ffffff;
      border-bottom-color: #ffffff;
      border-radius: 20px;
      padding: 4px 12px;
      display: flex;
      justify-content: space-between;
      color: #ffffff;
      font-family: Arial, sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Marquee wrapper tracks for horizontal scrolling text streams */
    .track-metadata {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 60%;
      overflow: hidden;
      white-space: nowrap;
    }

    /* Infinite Horizontal Marquee Scroll Animation Rules */
    .track-name {
      font-size: 0.7rem;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.5px;
      display: inline-block;
      padding-left: 100%;
      animation: sideMarquee 10s linear infinite;
    }

    .artist-name {
      font-size: 0.55rem;
      color: #cccccc;
      text-transform: uppercase;
      margin-top: 1px;
      display: inline-block;
      padding-left: 100%;
      animation: sideMarquee 10s linear infinite;
      animation-delay: 1.5s;
    }

    @keyframes sideMarquee {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* Right Panel UI Hooks (+prev+ / +next+) */
    .retro-actions-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 0.6rem;
      font-weight: bold;
      color: #ffffff;
      font-family: monospace;
      z-index: 2;
    }

    .action-tag {
      cursor: pointer;
      user-select: none;
    }

    .action-tag:hover {
      color: #d14702;
    }

    /* Audio Frequency Equalizer Bar Simulation */
    .equalizer-box {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      position: absolute;
      bottom: 4px;
      right: 54px;
      height: 14px;
    }

    .eq-bar {
      width: 3px;
      height: 2px;
      background-color: #33cc33;
      transition: height 0.15s ease;
    }

    /* Mobile Styles */
    @media (max-width: 600px) {
      #shop {
        margin: 20px auto;
        padding: 15px;
        gap: 35px;
      }

      .product {
        max-width: 100%;
      }

      /* Disables hover requirement on mobile touchscreens */
      .image-container:active .front-img-swap {
        opacity: 0;
      }
      .image-container:active .back-img {
        opacity: 1;
      }

      .sidebar-player {
        width: 320px;
      }
    }
  </style>
</head>

<body>

  <div id="shop">
    <!-- Slot 1: MICKEYNMINNIE -->
    <div class="product">
      <div class="image-container">
        <img class="front-img-swap" src="/products/mickey-n-minnie-front.png" alt="MICKEYNMINNIE Front">
        <img class="back-img" src="/products/mickey-n-minnie-back.png" alt="MICKEYNMINNIE Back">
      </div>
      <h2>MICKEYNMINNIE</h2>
      <a href="https://square.link/u/cB6awjjF" target="_blank">
        <button>Buy Now - $10</button>
      </a>
    </div>

    <!-- Slot 2: HARLEMWORLD -->
    <div class="product">
      <div class="image-container">
        <img src="/products/harlem-world.png" alt="HARLEMWORLD">
      </div>
      <h2>HARLEMWORLD</h2>
      <a href="https://square.link/u/55luPAtf" target="_blank">
        <button>Buy Now - $10</button>
      </a>
    </div>

    <!-- Slot 3: CHACHAT -->
    <div class="product">
      <div class="image-container">
        <img src="/products/cha-chat.png" alt="CHACHAT">
      </div>
      <h2>CHACHAT</h2>
      <a href="https://square.link/u/lrpK7Pn1" target="_blank">
        <button>Buy Now - $10</button>
      </a>
    </div>
  </div>

  <!-- Retro Player Structural Shell Container -->
  <div class="player-wrapper">
    <div class="sidebar-player">
      <!-- Interactive Trigger Button -->
      <div class="retro-play-container" onclick="toggleAudio()">
        <div class="pause-icon" id="pauseBtnVisual">
          <div class="pause-bar"></div>
          <div class="pause-bar"></div>
        </div>
        <div class="play-icon" id="playBtnVisual"></div>
      </div>

      <!-- LCD Interface Matrix Display panel -->
      <div class="retro-display">
        <div class="track-metadata">
          <span class="track-name" id="trackNameDisplay">TRACK LOADING</span>
          <span class="artist-name" id="artistNameDisplay">ARTIST</span>
        </div>

        <!-- Equalizer node simulation overlay wrapper -->
        <div class="equalizer-box">
          <div class="eq-bar" id="eq1"></div>
          <div class="eq-bar" id="eq2"></div>
          <div class="eq-bar" id="eq3"></div>
          <div class="eq-bar" id="eq4"></div>
        </div>

        <div class="retro-actions-panel">
          <span class="action-tag" onclick="prevSong()">+prev+</span>
          <span class="action-tag" onclick="nextSong()">+next+</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden Audio Engine Core -->
  <audio id="audioPlayer"></audio>

  <script>
    const audioPlayer = document.getElementById('audioPlayer');
    const trackNameDisplay = document.getElementById('trackNameDisplay');
    const artistNameDisplay = document.getElementById('artistNameDisplay');
    const playVisual = document.getElementById('playBtnVisual');
    const pauseVisual = document.getElementById('pauseBtnVisual');

    const playlist = [
      { title: "Why Should I Be Sad", artist: "Britney Spears", url: "https://od.lk/s/OTBfNDMzODczOThf/Why%20Should%20I%20Be%20Sad.mp3" },
      { title: "Do It", artist: "Nelly Furtado", url: "https://od.lk/s/OTBfNDMzODczODhf/Nelly%20Furtado%20-%20Do%20It%20%28Official%20Music%20Video%29.mp3" },
      { title: "Gotta Get Thru This", artist: "Daniel Bedingfield", url: "https://od.lk/s/OTBfNTM0MTkyMzdfbkpyWWk/Daniel%20Bedingfield%20-%20Gotta%20Get%20Thru%20This%20%28Original%20Version%29%28TO%29.mp3" },
      { title: "Get Your Number", artist: "Mariah Carey", url: "https://od.lk/s/OTBfNDMzODczOTJf/Mariah%20Carey%20-%20Get%20Your%20Number.mp3" },
      { title: "Soft Spot", artist: "JMSN", url: "https://od.lk/s/OTBfNDMzODczOTlf/JMSN%20-%20Soft%20Spot%20%28Audio%29.mp3" },
      { title: "Glamorous", artist: "Fergie", url: "https://od.lk/s/OTBfNDMzODczOTVfcDFxSVg/Glamorous.mp3" },
      { title: "Do You Mind", artist: "Crazy Cousinz & Kyla Reid", url: "https://od.lk/s/OTBfNDMzODczOT3fNGZFV20/Do%20You%20Mind%20%28Crazy%20Cousinz%20Remix%29.mp3" },
      { title: "9 AM in Calabasas", artist: "Ayesha Erotica", url: "https://od.lk/s/OTBfNDMzODczOTdfNnV0b0g/Ayesha%20erotica%20-%209%20am%20in%20calabasas%20%28remix%29%20%5Boriginal%20version%5D.mp3" },
      { title: "Someone To Call My Lover", artist: "Janet Jackson", url: "https://od.lk/s/OTBfNTM0MTkyODVfZ2pEVWU/Someone%20To%20Call%20My%20Lover%20%28Single%20Edit%29.mp3" },
      { title: "Clothes Off!!", artist: "Gym Class Heroes", url: "https://od.lk/s/OTBfNTUzNzE2ODlfS29mNGE/Clothes%20Off%21%21.mp3" },
      { title: "Me and You (MySpace version)", artist: "Cassie", url: "https://od.lk/s/OTBfNTM0MTkyMDNfbW1kSDI/Cassie-%20Me%20and%20You%20%28Rare%20Original%20MySpace%20Music%20Video%29.mp3" },
      { title: "Promiscuous", artist: "Nelly Furtado ft. Timbaland", url: "https://od.lk/s/OTBfNDQ6MzI4NDZfRHNseno/Nelly%20Furtado%20-%20Promiscuous%20%28Official%20Music%20Video%29%20ft.%20Timbaland.mp3" },
      { title: "Slow Down", artist: "Bobby Valentino", url: "https://od.lk/s/OTBfNDQ6MzI4ODBfYnB0UXc/Slow%20Down%20%28Radio%20Edit%29.mp3" },
      { title: "My Love ft, TI", artist: "Justin Timberlake", url: "https://od.lk/s/OTBfNDQ6ODU2NTVfOUxieWI/My%20Love.mp3" }
    ];

    let currentTrackIndex = 0;
    let isInitialized = false;
    let eqInterval = null;

    function updatePlayerUI() {
      trackNameDisplay.textContent = playlist[currentTrackIndex].title;
      artistNameDisplay.textContent = playlist[currentTrackIndex].artist;
    }

    updatePlayerUI();

    function toggleAudio() {
      if (!isInitialized) {
        audioPlayer.src = playlist[currentTrackIndex].url;
        audioPlayer.load();
        isInitialized = true;
      }

      if (audioPlayer.paused) {
        audioPlayer.play().then(() => {
          pauseVisual.style.display = 'flex';
          playVisual.style.display = 'none';
          startEqualizerSim();
        }).catch(error => {
          console.log("Stream initialize blockage caught:", error);
        });
      } else {
        audioPlayer.pause();
        pauseVisual.style.display = 'none';
        playVisual.style.display = 'block';
        stopEqualizerSim();
      }
    }

    function nextSong() {
      currentTrackIndex++;
      if (currentTrackIndex >= playlist.length) {
        currentTrackIndex = 0;
      }
      forceTrackPlayback();
    }

    function prevSong() {
      currentTrackIndex--;
      if (currentTrackIndex < 0) {
        currentTrackIndex = playlist.length - 1;
      }
      forceTrackPlayback();
    }

    function forceTrackPlayback() {
      audioPlayer.src = playlist[currentTrackIndex].url;
      updatePlayerUI();
      audioPlayer.load();
      audioPlayer.play().then(() => {
        pauseVisual.style.display = 'flex';
        playVisual.style.display = 'none';
        startEqualizerSim();
      }).catch(error => console.log(error));
      isInitialized = true;
    }

    function startEqualizerSim() {
      if(eqInterval) clearInterval(eqInterval);
      eqInterval = setInterval(() => {
        for (let i = 1; i <= 4; i++) {
          const bar = document.getElementById('eq' + i);
          const randomHeight = Math.floor(Math.random() * 12) + 2;
          bar.style.height = randomHeight + 'px';
          
          if (randomHeight > 10) {
            bar.style.backgroundColor = '#ffcc00';
          } else {
            bar.style.backgroundColor = '#33cc33';
          }
        }
      }, 120);
    }

    function stopEqualizerSim() {
      clearInterval(eqInterval);
      for (let i = 1; i <= 4; i++) {
        document.getElementById('eq' + i).style.height = '2px';
        document.getElementById('eq' + i).style.backgroundColor = '#33cc33';
      }
    }

    audioPlayer.addEventListener('ended', nextSong);

    pauseVisual.style.display = 'none';
    playVisual.style.display = 'block';
  </script>

</body>
</html>
