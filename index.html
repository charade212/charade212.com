<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>charade212</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: black;
      overflow-y: auto;
    }

    #shop {
      max-width: 1200px;
      margin: 60px auto;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
    }

    .product {
      text-align: center;
      flex: 1 1 300px;
      max-width: 350px;
    }

    .product img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      transition: transform 0.2s ease;
    }

    .product img:hover {
      transform: scale(1.02);
    }

    .product h2 {
      font-size: 18px;
      letter-spacing: 1px;
      margin: 15px 0 10px;
    }

    button {
      background: black;
      color: white;
      border: none;
      padding: 12px 30px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
      width: 100%;
    }

    button:hover {
      background: #555;
    }
  </style>
</head>

<body>

  <div id="shop">
    <!-- Slot 1: MICKEYNMINNIE -->
    <div class="product">
      <a href="mickey-n-minnie.html">
        <img src="/products/mickey-n-minnie.jpg" alt="MICKEYNMINNIE">
      </a>
      <h2>MICKEYNMINNIE</h2>
      <a href="mickey-n-minnie.html">
        <button>View Product</button>
      </a>
    </div>

    <!-- Slot 2: HARLEMWORLD -->

      <a href="harlem-world.html">
        <img src="/products/harlem-world.jpg" alt="HARLEMWORLD">
      </a>
      <h2>HARLEMWORLD</h2>
      <a href="harlem-world.html">
        <button>View Product</button>
      </a>
    </div>

    <!-- Slot 3: CHACHAT -->
    <div class="product">
      <a href="cha-chat.html">
        <img src="/products/cha-cha-trucker.jpg" alt="CHACHAT">
      </a>
      <h2>CHACHAT</h2>
      <a href="cha-chat.html">
        <button>View Product</button>
      </a>
    </div>
  </div>

</body>
</html>
