<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>charade212</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: black;
      overflow-y: auto;
    }

    #shop {
      max-width: 1200px;
      margin: 60px auto;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
    }

    .product {
      text-align: center;
      flex: 1 1 300px;
      max-width: 350px;
    }

    /* Container for image sizing & hover swap */
    .image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 4px;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }

    /* Mickey & Minnie front/back hover effect */
    .image-container .back-img {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    .image-container:hover .front-img-swap {
      opacity: 0;
    }

    .image-container:hover .back-img {
      opacity: 1;
    }

    .image-container:hover img {
      transform: scale(1.02);
    }

    .product h2 {
      font-size: 18px;
      letter-spacing: 1px;
      margin: 15px 0 10px;
    }

    button {
      background: black;
      color: white;
      border: none;
      padding: 12px 30px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
      width: 100%;
    }

    button:hover {
      background: #555;
    }

    a {
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="shop">
    <!-- Slot 1: MICKEYNMINNIE -->
    <div class="product">
      <div class="image-container">
        <img class="front-img-swap" src="/products/mickey-n-minnie-front.png" alt="MICKEYNMINNIE Front">
        <img class="back-img" src="/products/mickey-n-minnie-back.png" alt="MICKEYNMINNIE Back">
      </div>
      <h2>MICKEYNMINNIE</h2>
      <a href="https://square.link/u/cB6awjjF" target="_blank">
        <button>Buy Now - $10</button>
      </a>
    </div>

    <!-- Slot 2: HARLEMWORLD -->
    <div class="product">
      <div class="image-container">
        <img src="/products/harlem-world.png" alt="HARLEMWORLD">
      </div>
      <h2>HARLEMWORLD</h2>
      <a href="https://square.link/u/55luPAtf" target="_blank">
        <button>Buy Now - $10</button>
      </a>
    </div>

    <!-- Slot 3: CHACHAT -->
    <div class="product">
      <div class="image-container">
        <img src="/products/cha-chat.png" alt="CHACHAT">
      </div>
      <h2>CHACHAT</h2>
      <a href="https://square.link/u/lrpK7Pn1" target="_blank">
        <button>Buy Now - $10</button>
      </a>
    </div>
  </div>

</body>
</html>
