  <meta charset="UTF-8">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: black;
      overflow-y: auto;
    }

    #shop {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .product {
      text-align: center;
      flex: 1 1 320px;
      max-width: 360px;
      width: 100%;
    }

    /* Container configured for 1920x1080 (16:9 ratio) */
    .image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 4px;
      background-color: #f5f5f5;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }

    /* Front/Back Hover Effect for Mickey & Minnie */
    .image-container .back-img {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    .image-container:hover .front-img-swap {
      opacity: 0;
    }

    .image-container:hover .back-img {
      opacity: 1;
    }

    .image-container:hover img {
      transform: scale(1.03);
    }

    .product h2 {
      font-size: 18px;
      letter-spacing: 1px;
      margin: 15px 0 10px;
    }

    button {
      background: black;
      color: white;
      border: none;
      padding: 14px 30px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
      width: 100%;
      border-radius: 2px;
    }

    button:hover {
      background: #333;
    }

    a {
      text-decoration: none;
    }

    /* Mobile Styles */
    @media (max-width: 600px) {
      #shop {
        margin: 20px auto;
        padding: 15px;
        gap: 35px;
      }

      .product {
        max-width: 100%;
      }

      /* Disables hover requirement on mobile touchscreens */
      .image-container:active .front-img-swap {
        opacity: 0;
      }
      .image-container:active .back-img {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div id="shop">
    <!-- Slot 1: MICKEYNMINNIE -->
    <div class="product">
      <div class="image-container">
        <img class="front-img-swap" src="/products/mickey-n-minnie-front.png" alt="MICKEYNMINNIE Front">
        <img class="back-img" src="/products/mickey-n-minnie-back.png" alt="MICKEYNMINNIE Back">
      </div>
      <h2>MICKEYNMINNIE</h2>
      <a href="https://square.link/u/cB6awjjF" target="_blank">
        <button>Buy Now - $10</button>
      </a>
    </div>

    <!-- Slot 2: HARLEMWORLD -->
    <div class="product">
      <div class="image-container">
        <img src="/products/harlem-world.png" alt="HARLEMWORLD">
      </div>
      <h2>HARLEMWORLD</h2>
      <a href="https://square.link/u/55luPAtf" target="_blank">
        <button>Buy Now - $10</button>
      </a>
    </div>

    <!-- Slot 3: CHACHAT -->
    <div class="product">
      <div class="image-container">
        <img src="/products/cha-chat.png" alt="CHACHAT">
      </div>
      <h2>CHACHAT</h2>
      <a href="https://square.link/u/lrpK7Pn1" target="_blank">
        <button>Buy Now - $10</button>
      </a>
    </div>
  </div>

</body>
